<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* GitHub Pages отдает эту страницу на любой несуществующий адрес, в том числе на вложенный
       вроде /cmt-most-site/раздел/страница. Относительные пути к стилям и картинкам от такого адреса
       не найдутся, поэтому сразу задаем основание: корень репозитория на github.io, иначе корень сайта.
       Тег base вставлен до ссылок ниже, поэтому действует на них. */
    (function () {
      var root = location.hostname.endsWith("github.io") ? "/" + location.pathname.split("/")[1] + "/" : "/";
      var base = document.createElement("base");
      base.href = root;
      document.head.appendChild(base);
    })();
  </script>
  <title>Страница не найдена · ЦМТ «Мост»</title>
  <meta name="description" content="Такой страницы на сайте ЦМТ «Мост» нет. Перейдите на главную или в другие разделы сайта.">

  <link rel="stylesheet" href="assets/css/style.css?v=82707851">

</head>

         Линии те же, что в assets/icons/favicon.svg, только каждая дуга разрезана пополам. -->
    <!-- поле viewBox с запасом по бокам: половины разъезжаются, и без запаса края обрезались бы -->

      <g stroke="currentColor" stroke-width="9" stroke-linecap="round">
        <g class="bridge__half bridge__half--left">
          <path d="M31 41C36 70 55 85 78 85"/>
          <path d="M31 41C37 66 38 92 26 111"/>

          <path d="M78 85C101 85 120 70 125 41"/>
          <path d="M125 41C119 66 118 92 130 111"/>
          <path d="M78 88C96 88 111 92 130 111"/>
          <path d="M116 76 101 114"/>
        </g>
      </g>
    </svg>
