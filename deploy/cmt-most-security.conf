# Заголовки безопасности сайта ЦМТ «Мост». Кладется в /etc/nginx/snippets/cmt-most-security.conf
# и подключается из deploy/nginx.conf.

# только HTTPS в течение года (включать, когда сертификат уже работает)
add_header Strict-Transport-Security "max-age=31536000" always;
# браузер не угадывает тип файла по содержимому
add_header X-Content-Type-Options "nosniff" always;
# сайт нельзя встроить в чужую страницу (защита от подмены кликов)
add_header X-Frame-Options "DENY" always;
# на чужие сайты уходит только адрес нашего сайта, без пути и параметров
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# камера, микрофон, геолокация сайту не нужны
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# та же политика, что в <meta> страниц, плюс frame-ancestors: в meta он не работает
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
