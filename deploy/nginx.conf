# Сайт ЦМТ «Мост» на собственном сервере (nginx). Пример для сайта в корне домена.
# Подставить: домен (server_name и сертификаты) и папку, куда скопирован dist/ (root).
# Порядок переезда описан в deploy/README.md.

server {
    listen 80;
    listen [::]:80;
    server_name bridge.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bridge.example.ru;

    ssl_certificate     /etc/ssl/bridge/fullchain.pem;
    ssl_certificate_key /etc/ssl/bridge/privkey.pem;

    root /var/www/cmt-most;
    index index.html;
    charset utf-8;
    server_tokens off;

    # сжатие: файлы данных сайта (data.js, abstracts.js) весят по 0,5 МБ и сжимаются в 4-5 раз
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/plain;

    # страница «не найдено» одна на любой несуществующий адрес; ее тег base вписывает сборка
    error_page 404 /404.html;

    # заголовки безопасности подключаются в каждом location: как только в location есть свой
    # add_header (у нас это Cache-Control), заголовки уровня server nginx туда не наследует
    location / {
        include /etc/nginx/snippets/cmt-most-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # стили и скрипты подключаются с меткой ?v=хэш, у шрифтов хэш в имени файла:
    # при любой правке адрес меняется, поэтому кэшировать можно надолго
    location ~* \.(css|js|woff2)$ {
        include /etc/nginx/snippets/cmt-most-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # картинки меняются редко, но имена у части из них без хэша: неделя
    location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/snippets/cmt-most-security.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # служебные файлы в dist/ не попадают, но на всякий случай: скрытые файлы не отдаем
    location ~ /\. {
        deny all;
    }
}
